services:
  db:
    image: nickblah/postgis:18-postgis-3.6.4
    container_name: postgis
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nyc
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql

  adminer:
    image: adminer:latest
    container_name: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgis_data:
